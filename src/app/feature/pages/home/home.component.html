<section id="inicio" class="home-region" aria-labelledby="hero-title" appHomeSection="inicio">
  <app-banner [content]="content.hero"></app-banner>
</section>

@if (visibleClients.length) {
  <section id="clientes" class="home-region" aria-labelledby="clientes-title" appHomeSection="clientes" appRevealOnScroll>
    <app-our-clients [clients]="visibleClients"></app-our-clients>
  </section>
}

<section id="desafios" class="home-region appland-section" aria-labelledby="desafios-title" appHomeSection="desafios" appRevealOnScroll>
  <app-home-challenges [challenges]="content.challenges" [contactAction]="content.contact.meetingAction"></app-home-challenges>
</section>

<section id="servicios" class="home-region appland-section" aria-labelledby="servicios-title" appHomeSection="servicios" appRevealOnScroll>
  <app-home-services [services]="content.services"></app-home-services>
</section>

<section id="casos" class="home-region appland-section" aria-labelledby="casos-title" appHomeSection="casos" appRevealOnScroll>
  <app-success-stories [cases]="visibleCases"></app-success-stories>
</section>

<section id="ia" class="home-region appland-section" aria-labelledby="ia-title" appHomeSection="ia" appRevealOnScroll>
  <app-ai-solution [applications]="content.aiApplications" [contactAction]="content.contact.meetingAction"></app-ai-solution>
</section>

@if (visibleProducts.length) {
  <section id="productos" class="home-region appland-section" aria-labelledby="productos-title" appHomeSection="productos" appRevealOnScroll>
    <app-home-products [products]="visibleProducts"></app-home-products>
  </section>
}

<section id="por-que-appland" class="home-region appland-section" aria-labelledby="por-que-appland-title" appHomeSection="por-que-appland" appRevealOnScroll>
  <app-why [benefits]="content.benefits"></app-why>
</section>

<section id="equipo-global" class="home-region appland-section" aria-labelledby="equipo-global-title" appHomeSection="equipo-global" appRevealOnScroll>
  <app-team-coverage [countries]="content.countries"></app-team-coverage>
</section>

<section id="contacto" class="home-region appland-section home-region--contact" aria-labelledby="contacto-title" appHomeSection="contacto" appRevealOnScroll>
  <app-home-cta [content]="content.contact"></app-home-cta>
</section>
