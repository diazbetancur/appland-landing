<div class="appland-container">
  <div class="cases__heading">
    <div>
      <p class="appland-eyebrow">Casos de éxito</p>
      <h2 id="casos-title" class="appland-heading">
        Algunos <span class="cases__highlight">proyectos</span> desarrollados
      </h2>
      <span class="cases__rule" aria-hidden="true"></span>
    </div>
    <div class="cases__controls">
      <button type="button" aria-label="Caso anterior" [disabled]="!carousel.canMovePrevious" (click)="carousel.movePrevious()">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <button type="button" aria-label="Caso siguiente" [disabled]="!carousel.canMoveNext" (click)="carousel.moveNext()">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>
  </div>

  <div
    #carousel="appHorizontalCarousel"
    class="cases__track"
    [class.cases__track--few]="cases.length < 3"
    appHorizontalCarousel
    [itemCount]="cases.length"
    role="region"
    aria-labelledby="casos-title"
    aria-roledescription="carrusel"
    tabindex="0"
    >
    @for (item of cases; track item; let index = $index) {
      <article class="case-card">
        @if (item.media; as media) {
          <div class="case-card__media">
            <img [src]="media.src" [alt]="media.alt" [width]="media.width" [height]="media.height" loading="lazy">
          </div>
        }
        <div class="case-card__body">
          <p class="case-card__number">0{{ index + 1 }}</p>
          <h3>{{ item.name }}</h3>
          <p>{{ item.summary }}</p>
          @if (destinationHref(item.destination); as href) {
            <a [href]="href" target="_blank" rel="noopener noreferrer">
              Ver caso
              <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </a>
          }
        </div>
      </article>
    }
  </div>
  <p class="cases__position" aria-live="polite">{{ carousel.positionLabel }}</p>
</div>
