<div class="appland-container why">
  <header class="why__intro">
    <p class="appland-eyebrow">¿Por qué APPLAND?</p>
    <h2 id="por-que-appland-title" class="appland-heading">Tecnología cercana, experiencia global y ejecución que escala</h2>
  </header>

  <ul class="why__grid">
    <li *ngFor="let benefit of benefits; let index = index">
      <span class="why__number" aria-hidden="true">0{{ index + 1 }}</span>
      <p>{{ benefit.statement }}</p>
    </li>
  </ul>
</div>
