<div class="clients appland-container">
  <div class="clients__heading">
    <h2 id="clientes-title">Empresas que han confiado en nosotros</h2>
  </div>
  <div
    class="clients__viewport"
    (mouseenter)="setInteractionPause(true)"
    (mouseleave)="setInteractionPause(false)"
    (focusin)="setInteractionPause(true)"
    (focusout)="setInteractionPause(false)"
  >
    <div class="clients__track" [class.clients__track--paused]="paused">
      <div class="clients__group">
        @for (client of clients; track client) {
          <img
            [src]="client.logo.src"
            [alt]="client.logo.alt"
            [width]="client.logo.width"
            [height]="client.logo.height"
            loading="lazy"
          />
        }
      </div>
      <div class="clients__group" aria-hidden="true">
        @for (client of clients; track client) {
          <img
            [src]="client.logo.src"
            alt=""
            [width]="client.logo.width"
            [height]="client.logo.height"
            loading="lazy"
          />
        }
      </div>
    </div>
  </div>
</div>
